name: pages

# Builds the site (mkdocs.yml) from the repository and deploys it to GitHub
# Pages on every push to main. The bench and ledger workflows commit results
# with [skip ci], which fires no push run, so their completion redeploys too.
# Pull requests that touch the site only build it.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "README.md"
      - "reports/**"
      - "leaderboard/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: [bench, ledger]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install MkDocs
        run: pip install -r docs/requirements.txt
      - uses: actions/cache@v4
        with:
          # Social-card fonts and rendered cards
          path: .cache
          key: mkdocs-${{ hashFiles('docs/requirements.txt') }}-${{ github.sha }}
          restore-keys: mkdocs-${{ hashFiles('docs/requirements.txt') }}-
      - name: Build
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
