name: pages

# Builds the site (mkdocs.yml) from the repository and deploys it to GitHub
# Pages whenever main changes. Pushes by GITHUB_TOKEN fire no workflows: the
# Auto Merge workflow merges pull requests that way, and bench and ledger
# commit with [skip ci]. So the end of any of those runs also triggers this
# workflow, which deploys main if it differs from the last deployment.
# Pull requests that touch the site only build it.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "README.md"
      - "reports/**"
      - "leaderboard/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: [Auto Merge, bench, ledger]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changed:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      deploy: ${{ steps.compare.outputs.deploy }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          deployed="$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=1" --jq '.[0].sha // ""')"
          head="$(gh api "repos/$REPO/commits/${{ github.event.repository.default_branch }}" --jq .sha)"
          echo "main $head, deployed ${deployed:-none}"
          echo "deploy=$([ "$deployed" != "$head" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: changed
    if: ${{ !cancelled() && (needs.changed.result == 'skipped' || needs.changed.outputs.deploy == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install MkDocs
        run: pip install -r docs/requirements.txt
      - uses: actions/cache@v4
        with:
          # Social-card fonts and rendered cards
          path: .cache
          key: mkdocs-${{ hashFiles('docs/requirements.txt') }}-${{ github.sha }}
          restore-keys: mkdocs-${{ hashFiles('docs/requirements.txt') }}-
      - name: Build
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    # A skipped `changed` would skip this job too without an explicit condition.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
