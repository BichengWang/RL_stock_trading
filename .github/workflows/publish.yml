name: publish

# Publishing a GitHub release tagged v<version> uploads that version to PyPI.
# Uploads use PyPI trusted publishing (no token): the project's publisher on
# PyPI must name this repository, this workflow file and the `pypi` environment.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build source archive and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c "from pathlib import Path; print(next(Path('dist').glob('*.whl')).name.split('-')[1])")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match package version $version (expected v$version)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rl-pricing/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
